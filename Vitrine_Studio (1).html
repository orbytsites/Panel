<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Vitrine Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>.flex{display:flex}.flex-1{flex:1 1 0%}.gap-3{gap:.75rem}.items-center{align-items:center}.min-w-0{min-width:0}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: workspace de duas colunas. Esquerda = editor em abas (cartão). Direita = palco pontilhado com o celular escalado para caber. */
:root{
  --bg:#EDEFF3; --panel:#FFFFFF; --panel2:#F4F6F9; --ink:#12151C; --muted:#586072; --line:#D8DDE6;
  --accent:#1F5EFF; --accent-ink:#FFFFFF; --accent-soft:#E4EBFF; --danger:#C62828;
  --stage:#E2E6ED; --dot:#BFC5D0;
  --ui:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1015; --panel:#161A21; --panel2:#1D222B; --ink:#E9ECF2; --muted:#9AA3B4; --line:#2A303B;
    --accent:#7CA3FF; --accent-ink:#0A1226; --accent-soft:#1F2B49; --danger:#FF8080;
    --stage:#11151C; --dot:#262C37; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1015; --panel:#161A21; --panel2:#1D222B; --ink:#E9ECF2; --muted:#9AA3B4; --line:#2A303B;
  --accent:#7CA3FF; --accent-ink:#0A1226; --accent-soft:#1F2B49; --danger:#FF8080;
  --stage:#11151C; --dot:#262C37; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--ui);
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{display:inline-block;flex:none;vertical-align:-.2em}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;min-width:0}
.top{display:flex;align-items:center;gap:12px;min-width:0;min-height:38px}
.mark{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand b{font-size:16px;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-weight:600;font-size:12.5px;white-space:nowrap}
.work{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:12px;min-height:0;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;min-height:0;min-width:0}
.editor{display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{display:inline-flex;align-items:center;gap:7px;padding:10px 13px;border:0;background:none;color:var(--muted);font:600 13px var(--ui);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;border-radius:8px 8px 0 0}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.panel{overflow:auto;padding:20px 20px 32px;min-height:0}
.panel h2{margin:0 0 4px;font-size:18px;letter-spacing:-.015em}
.hint{margin:0 0 16px;color:var(--muted);font-size:13px;max-width:60ch}
.stage{display:grid;place-items:center;overflow:hidden;position:relative;background-color:var(--stage);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:18px 18px}
#phoneBox{position:relative;flex:none}
.mswitch{display:none}
@media (min-width:760px){
  .work{grid-template-columns:minmax(340px,560px) minmax(0,1fr)}
}
@media (max-width:759px){
  .work{grid-template-rows:minmax(0,42%) minmax(0,1fr)}
  .stage{order:-1}
  .brand .sub{display:none}
  .panel{padding:16px 14px 28px}
}

/* ---------- componentes do editor ---------- */
.fld{display:flex;flex-direction:column;min-width:0;margin-bottom:14px}
.lbl{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:5px}
.inp{width:100%;min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--ink);padding:0 11px;font:inherit;transition:border-color .15s,background .15s}
textarea.inp{padding:9px 11px;resize:vertical;line-height:1.45}
.inp:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.inp:focus{outline:none;border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.sm{min-height:32px;font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 13px var(--ui);cursor:pointer;transition:transform .12s,background .15s,border-color .15s}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));background:var(--panel2)}
.btn:active{transform:scale(.97)}
.btn.sm{min-height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.warn{border-color:var(--danger);color:var(--danger)}
.icon-btn{width:30px;height:30px;border-radius:8px;border:0;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
.icon-btn:hover:not(:disabled){background:var(--panel2);color:var(--ink)}
.icon-btn:disabled{opacity:.3;cursor:default}
.icon-btn.del:hover:not(:disabled){color:var(--danger)}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:16px}
.nbtn{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,transform .12s}
.nbtn:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.nbtn:active{transform:scale(.98)}
.nbtn .nic{grid-row:1/3;width:40px;height:40px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;color:var(--accent)}
.nbtn b{font-size:13.5px;line-height:1.2}
.nbtn small{color:var(--muted);font-size:12px}
.nbtn[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.nbtn[aria-pressed=true] .nic{background:var(--accent);color:var(--accent-ink)}
.note{border:1px dashed var(--line);border-radius:12px;padding:11px 13px;color:var(--muted);font-size:12.5px;margin-bottom:14px}
.drop{display:flex;gap:12px;align-items:center;border:1.5px dashed var(--line);border-radius:14px;padding:10px;background:var(--panel2);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.dprev{width:64px;height:64px;border-radius:12px;background-size:cover;background-position:center;flex:none;border:1px solid var(--line)}
.dprev.round{border-radius:50%}
.dbody{display:grid;gap:7px;min-width:0;flex:1}
.dbody small{color:var(--muted);font-size:11.5px}
.drow{display:flex;gap:6px;flex-wrap:wrap}
.colorrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=color].inp{width:52px;padding:3px;min-height:38px;cursor:pointer}
.swatches{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;transition:transform .12s}
.sw:hover{transform:scale(1.12)}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{display:grid;gap:4px;justify-items:start;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.opt:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.opt .aa{font-size:22px;line-height:1}
.opt small{color:var(--muted);font-size:11.5px;font-weight:600}
.tprev{width:100%;height:46px;border-radius:8px;display:grid;grid-template-columns:1fr;align-content:center;gap:5px;padding:8px;border:1px solid rgba(128,128,128,.3)}
.tprev i{display:block;height:6px;border-radius:3px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px}
.fgrid .full{grid-column:1/-1}
.lsec{margin-bottom:26px}
.lsec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.lsec-h h3{margin:0;font-size:15px}
.lsec-h small{color:var(--muted)}
.icard{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:8px;transition:border-color .15s,box-shadow .15s}
.icard.open{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 4px 18px -10px rgba(0,0,0,.35)}
.icard.over{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ich{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 4px}
.grip{width:22px;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none;align-self:stretch}
.ich-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;text-align:left;padding:2px;border-radius:8px;cursor:pointer}
.ith{width:40px;height:40px;border-radius:10px;background-color:var(--panel2);background-size:cover;background-position:center;flex:none;border:1px solid var(--line)}
.itx{min-width:0;display:grid}
.itx b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itx small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iact{display:flex;flex:none}
.icb{padding:4px 14px 6px;border-top:1px solid var(--line);padding-top:14px}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:20px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- celular ---------- */
.phone{position:absolute;left:0;top:0;width:390px;height:800px;padding:10px;border-radius:54px;background:#0A0B0E;transform-origin:0 0;
  box-shadow:inset 0 0 0 2px #30343C,0 0 0 1px rgba(255,255,255,.08),0 40px 70px -28px rgba(0,0,0,.55);font-family:var(--p-body)}
.phone:before,.phone:after{content:"";position:absolute;width:4px;background:#1A1C21;border-radius:2px}
.phone:before{left:-4px;top:150px;height:58px}
.phone:after{right:-4px;top:196px;height:90px}
.screen{position:relative;width:370px;height:780px;border-radius:44px;overflow:hidden;background:var(--p-bg);color:var(--p-text);display:flex;flex-direction:column;isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:106px;height:31px;border-radius:20px;background:#000;z-index:30}
.sbar{flex:none;height:48px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0;font:600 14px var(--ui);color:var(--p-text);background:var(--p-bg);z-index:5}
.sbar span:last-child{display:flex;gap:5px;align-items:center}
.ubar{flex:none;margin:0 14px 8px;height:36px;border-radius:12px;background:var(--p-s2);display:flex;align-items:center;justify-content:center;gap:6px;font:500 12px var(--ui);color:var(--p-m);z-index:5;min-width:0}
.ubar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative;overscroll-behavior:contain}
.ph-scroll::-webkit-scrollbar{display:none}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:var(--p-text);opacity:.4;z-index:70;pointer-events:none}
.phone button,.phone a{-webkit-tap-highlight-color:transparent}
.phone h1,.phone h2,.phone h4{margin:0}
.phone .ic{vertical-align:-.22em}

.ph-banner{height:150px;background-size:cover;background-position:center;position:relative}
.ph-banner:after{content:"";position:absolute;inset:auto 0 0 0;height:80px;background:linear-gradient(transparent,var(--p-bg))}
.ph-prof{padding:0 18px 6px;margin-top:-46px;position:relative;z-index:1}
.ph-logo{width:88px;height:88px;border-radius:50%;border:4px solid var(--p-bg);background-size:cover;background-position:center;box-shadow:0 8px 20px rgba(0,0,0,.28)}
.ph-name{font:700 26px/1.1 var(--p-display);margin:12px 0 5px;letter-spacing:-.01em;text-wrap:balance}
.ph-tag{color:var(--p-m);font-size:13px;line-height:1.5;margin:0 0 11px}
.ph-meta{display:grid;gap:5px;font-size:12px;color:var(--p-m)}
.ph-meta span{display:flex;gap:7px;align-items:flex-start}
.ph-meta .ic{margin-top:1px;color:var(--p-ac)}
.ph-act{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;margin:15px 0 4px}
.ph-btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 12px;border-radius:14px;font:700 13px var(--p-body);border:0;cursor:pointer;text-decoration:none;transition:transform .15s,filter .15s;color:inherit}
.ph-btn:active{transform:scale(.96)}
.ph-btn:hover{filter:brightness(1.07)}
.ph-btn-wa{background:#22C55E;color:#032010}
.ph-btn-main{background:var(--p-accent);color:var(--p-ink)}
.ph-btn-ghost{background:var(--p-s2);color:var(--p-text);border:1px solid var(--p-l)}
.ph-btn.is-off{opacity:.45}
.ph-btn[disabled]{opacity:.6;pointer-events:none}
.ph-note{margin:8px 0 0;color:var(--p-m);font:500 12px/1.45 var(--p-body)}
.ph-qr{width:200px;height:200px;margin:4px auto 10px;padding:10px;background:#fff;border-radius:14px}
.ph-qr svg{display:block;width:100%;height:100%}
.ph-code{font:500 11px/1.4 var(--mono);word-break:break-all;background:var(--p-s2);border:1px solid var(--p-l);border-radius:12px;padding:10px;max-height:92px;overflow:auto;color:var(--p-text)}
.ph-ok{width:64px;height:64px;border-radius:50%;background:var(--p-soft);color:var(--p-accent);display:grid;place-items:center;margin:10px auto 12px}
.code{font:12px/1.5 var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;white-space:pre;margin:8px 0 0}
.pnote{margin:6px 0 0;color:var(--muted);font-size:12.5px;max-width:60ch}
.pnote.bad{color:var(--danger)}
.ph-sec{padding:22px 18px 10px}
.ph-eyebrow{font:700 10px var(--p-body);letter-spacing:.17em;text-transform:uppercase;color:var(--p-ac)}
.ph-h2{font:700 21px/1.2 var(--p-display);margin:4px 0 0;text-wrap:balance}
.ph-sub{margin:4px 0 0;color:var(--p-m);font-size:12.5px}
.ph-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 12px;scrollbar-width:none}
.ph-chips::-webkit-scrollbar{display:none}
.ph-chip{flex:none;border:1px solid var(--p-l);background:var(--p-s);color:var(--p-m);padding:7px 14px;border-radius:99px;font:600 12px var(--p-body);cursor:pointer;transition:background .15s,color .15s}
.ph-chip[aria-pressed=true]{background:var(--p-accent);border-color:var(--p-accent);color:var(--p-ink)}
.ph-list{padding:0 18px;display:flex;flex-direction:column;gap:14px}
.ph-card{background:var(--p-s);border:1px solid var(--p-l);border-radius:20px;overflow:hidden}
.ph-card-img{height:158px;background-size:cover;background-position:center;position:relative}
.ph-badge{position:absolute;top:10px;left:10px;background:var(--p-accent);color:var(--p-ink);font:800 10px var(--p-body);letter-spacing:.08em;padding:5px 9px;border-radius:99px}
.ph-card-b{padding:14px 14px 15px}
.ph-card h4{font:700 17px/1.25 var(--p-display);margin-bottom:4px}
.ph-card p{margin:0;color:var(--p-m);font-size:12.5px;line-height:1.5}
.ph-inc{list-style:none;margin:11px 0 2px;padding:0;display:grid;gap:6px;font-size:12.5px}
.ph-inc li{display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.ph-inc .ic{color:var(--p-ac);margin-top:1px}
.ph-price{display:flex;align-items:baseline;gap:8px;margin:12px 0}
.ph-price s{color:var(--p-m);font-size:12px;font-family:var(--p-body)}
.ph-price b{font:800 21px var(--p-body);letter-spacing:-.02em}
.ph-add{width:100%;min-height:44px;border-radius:13px;border:1.5px solid var(--p-ac);background:transparent;color:var(--p-ac);font:700 13px var(--p-body);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:background .18s,color .18s,transform .12s}
.ph-add:active{transform:scale(.97)}
.ph-add[aria-pressed=true]{background:var(--p-accent);border-color:var(--p-accent);color:var(--p-ink)}
.ph-spec{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:13px 0 9px}
.ph-spec div{display:flex;gap:9px;align-items:center;background:var(--p-s2);border-radius:12px;padding:9px 10px;min-width:0}
.ph-spec .ic{color:var(--p-ac)}
.ph-spec small{display:block;color:var(--p-m);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.ph-spec b{display:block;font:700 12.5px var(--p-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-laudo{display:flex;gap:8px;align-items:center;padding:9px 11px;border-radius:12px;font:700 12px var(--p-body);background:rgba(34,197,94,.14);color:#27A85B}
.ph-laudo.warn{background:rgba(245,158,11,.14);color:#D98A08}
.ph-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph-2.mt{margin-top:12px}
.ph-cmpw{margin:0;background:var(--p-s);border:1px solid var(--p-l);border-radius:20px;padding:8px 8px 12px}
.ph-cmpw figcaption{padding:10px 6px 0;font:700 13px var(--p-body)}
.cmp{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize;background:#000;max-width:100%}
.cmp .lay{position:absolute;inset:0;background-size:cover;background-position:center;pointer-events:none}
.cmp .bef{clip-path:inset(0 calc(100% - var(--pos)) 0 0)}
.cmp .hd{position:absolute;top:0;bottom:0;left:var(--pos);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);pointer-events:none}
.cmp .knob{position:absolute;top:50%;left:var(--pos);width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.cmp .tag{position:absolute;bottom:9px;font:800 9.5px var(--p-body);letter-spacing:.14em;padding:4px 8px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;pointer-events:none}
.cmp .tag.l{left:9px}.cmp .tag.r{right:9px}
.ph-hs{display:flex;gap:12px;overflow-x:auto;padding:0 18px 8px;scrollbar-width:none}
.ph-hs::-webkit-scrollbar{display:none}

function itemArt(it){var b=state.brand,n=NICHES[state.niche];
  if(state.niche==='dealer'){var P=['#cfd3da','#1f2638','#8c1d2b','#2f5d8a','#3b3f46'];return carSvg(P[hash(it.name)%P.length],'show',hash(it.name)%9+1)}
  var k=hash(it.name)%4;return thumb(n.icon,mix(b.color,'#000000',.15+k*.07),mix(b.color,'#000000',.68))}
function cartLines(){return Object.keys(cart).map(function(id){var c=cart[id],it=find('items',id)||(VIRT[id]?Object.assign({id:id},VIRT[id]):null);return it?{id:id,it:it,qty:c.qty||1,finance:!!c.finance}:null}).filter(Boolean)}
function totalOf(L){return L.reduce(function(a,x){return a+(x.it.price||0)*x.qty},0)}
function chipsOf(){return state.items.map(function(i){return i.cat}).filter(function(v,i,a){return v&&a.indexOf(v)===i})}
function filtered(){return ui.cat==='all'?state.items:state.items.filter(function(i){return i.cat===ui.cat})}

function applyTheme(){
  var b=state.brand,t=TH[b.theme]||TH.dark,f=FONTS[b.font]||FONTS.sans,ac=isHex(b.color)?b.color:'#1F5EFF';
  var v={'--p-bg':t.bg,'--p-s':t.s,'--p-s2':t.s2,'--p-text':t.t,'--p-m':t.m,'--p-l':t.l,'--p-accent':ac,'--p-ink':inkOn(ac),'--p-ac':readable(ac,t.bg),'--p-soft':mix(ac,t.bg,.86),'--p-bub':t.bub,'--p-bubi':t.bubi,'--p-display':f.d,'--p-body':f.b};

}

function buildMsg(){
  var n=NICHES[state.niche],mode=n.mode,L=cartLines(),name=(ck.name||'').trim()||'[seu nome]',o=[];
  o.push(mode==='order'?'*Novo pedido — '+state.info.name+'*':mode==='interest'?'*Tenho interesse — '+state.info.name+'*':'*Pedido de agendamento — '+state.info.name+'*','');
  o.push(mode==='order'?'Olá! Gostaria de fazer o pedido abaixo:':mode==='interest'?'Olá! Vi o catálogo digital e tenho interesse no(s) veículo(s) abaixo:':'Olá! Gostaria de agendar o(s) serviço(s) abaixo:','');
  L.forEach(function(x){var it=x.it,val=it.price>0?' — '+money(it.price*x.qty):(it.free?' — sem custo':' — sob consulta'),qt=(mode==='order'||x.qty>1)?x.qty+'x ':'',ex=mode==='interest'&&it.year?' ('+it.year+')':'';
    o.push('• '+qt+it.name+ex+val+(x.finance?'\n   ↳ Quero simular financiamento':''))});
  var t=totalOf(L);if(t>0&&mode!=='interest')o.push('','*Total: '+money(t)+'*');
  o.push('','*Meus dados*','Nome: '+name);
  if(mode==='booking'){if(ck.date)o.push('Data: '+fmtDate(ck.date));if(ck.time)o.push('Horário: '+ck.time)}
  if(mode==='order'){o.push('Recebimento: '+ck.delivery);if(ck.delivery==='Entrega'&&ck.address.trim())o.push('Endereço: '+ck.address.trim());o.push('Pagamento: '+ck.pay)}
  if(mode==='interest'){if(ck.entry.trim())o.push('Entrada: '+ck.entry.trim());if(ck.trade)o.push('Tenho veículo para dar na troca')}
  if(ck.notes.trim())o.push('Obs.: '+ck.notes.trim());
  return o.join('\n')}

function renderSheet(){

  if(mode==='order'){f+='<div class="ph-seg">'+['Entrega','Retirada'].map(function(v){return '<button data-ckset="delivery:'+v+'" aria-pressed="'+(ck.delivery===v)+'">'+v+'</button>'}).join('')+'</div>';
    if(ck.delivery==='Entrega')f+=pfield('address','Endereço de entrega','text','Rua, número e bairro');
    f+='<div class="ph-fld"><label for="ck-pay">Pagamento</label><select class="ph-in" id="ck-pay" data-ck="pay">'+['Pix','Cartão na entrega','Dinheiro'].map(function(v){return '<option'+(ck.pay===v?' selected':'')+'>'+v+'</option>'}).join('')+'</select></div>'}
  if(mode==='interest'){f+=pfield('entry','Valor de entrada (opcional)','text','Ex.: R$ 30.000');f+='<label class="ph-chk"><input type="checkbox" id="ck-trade" data-ck="trade"'+(ck.trade?' checked':'')+'>Tenho veículo para dar na troca</label>'}
  f+=pfield('notes','Observações','textarea','Algo que devemos saber?');
  var po=payOn(),ms=pmethods(),pp=state.pay;
  if(po){if(ms.indexOf(ck.pm)<0)ck.pm=ms[0];f+='<div class="ph-lab">Pagamento online</div><div class="ph-seg" style="grid-template-columns:repeat('+ms.length+',1fr)">'+ms.map(function(v){return '<button data-ckset="pm:'+v+'" aria-pressed="'+(ck.pm===v)+'">'+(v==='pix'?'Pix':'Cartão')+'</button>'}).join('')+'</div>'+(PS.err?'<p class="ph-note" style="color:#ff8a80">'+esc(PS.err)+'</p>':'')+((!pp.endpoint&&!(ck.pm==='pix'&&(pp.pixKey||'').trim()))?'<p class="ph-note">Modo demonstração: configure o Pix ou a API na aba Pagamentos.</p>':'')}
  var title=mode==='order'?'Finalizar pedido':mode==='interest'?'Enviar interesse':'Solicitar agendamento';
  sheet.innerHTML='<div class="bd" data-close="1"></div><div class="pn" role="dialog" aria-modal="true" aria-label="'+title+'"><div class="h"><b>'+title+'</b><button class="x" data-close="1" aria-label="Fechar">'+ic('x',17)+'</button></div><div class="b"><div class="ph-lab">'+(mode==='interest'?'Seus interesses':mode==='order'?'Seu pedido':'Serviços escolhidos')+'</div>'+lines+(t>0&&mode!=='interest'?'<div class="ph-tot"><span>Total</span><span>'+money(t)+'</span></div>':'')+'<div class="ph-lab">Seus dados</div>'+f+'<div class="ph-lab">Mensagem para o WhatsApp</div><div class="ph-bub" id="bubble"></div></div><div class="f"><p class="ph-hint" id="sendHint"></p>'+(po?'<button class="ph-btn ph-btn-main" data-pay="1" style="width:100%;margin-bottom:8px"'+(PS.busy?' disabled':'')+'>'+ic('lock',16,2)+(PS.busy?'Processando…':'Pagar '+money(t)+' online')+'</button>':'')+'<a class="ph-btn ph-btn-wa" id="sendLink" href="#" target="_blank" rel="noopener">'+ic('whatsapp',18)+'Enviar pelo WhatsApp</a></div></div>';
  updateMsg()}

  var a=$('#sendLink'),nm=(ck.name||'').trim().length>=2,ph=!!phoneDigits(),ok=nm&&ph;a.href=ok?waLink(m):'#';a.classList.toggle('is-off',!ok);

function defPay(){return {on:true,pix:true,card:true,pixKey:'',pixName:'',pixCity:''}}
var PS={stage:'form',busy:false,pix:'',oid:'',err:'',demo:false};
function pReset(){PS={stage:'form',busy:false,pix:'',oid:'',err:'',demo:false}}
function pmethods(){var p=state.pay,m=[];if(p.pix)m.push('pix');if(p.card)m.push('card');return m}
function payOn(){return !!state.pay.on&&NICHES[state.niche].mode!=='interest'&&totalOf(cartLines())>0&&pmethods().length>0}
function crc16(s){var c=0xFFFF;for(var i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(var j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function tlv(id,v){return id+('0'+v.length).slice(-2)+v}
function ascii(s,n){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'').trim().slice(0,n)}
function pixPayload(total,oid){var p=state.pay,key=(p.pixKey||'').trim();if(!key)return '';
  var s=tlv('00','01')+tlv('01','11')+tlv('26',tlv('00','br.gov.bcb.pix')+tlv('01',key))+tlv('52','0000')+tlv('53','986')+tlv('54',total.toFixed(2))+tlv('58','BR')+tlv('59',ascii(p.pixName||state.info.name,25).toUpperCase()||'LOJA')+tlv('60',ascii(p.pixCity,15).toUpperCase()||'SAO PAULO')+tlv('62',tlv('05',oid.replace(/[^A-Za-z0-9]/g,'').slice(0,25)||'***'))+'6304';
  return s+crc16(s)}
function qrSvg(t){try{var q=qrcode(0,'M');q.addData(t);q.make();var n=q.getModuleCount(),d='';for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))d+='M'+c+' '+r+'h1v1h-1z';return '<svg viewBox="0 0 '+n+' '+n+'" shape-rendering="crispEdges" role="img" aria-label="QR Code Pix"><path d="'+d+'" fill="#000"/></svg>'}catch(e){return ''}}
function doPay(){var t=totalOf(cartLines()),p=state.pay,oid='VS'+Date.now().toString(36).toUpperCase();
  if((ck.name||'').trim().length<2){var n=$('#ck-name');if(n)n.focus();phToast('Preencha seu nome');return}
  PS.oid=oid;PS.err='';
  if(ck.pm==='pix'&&(p.pixKey||'').trim()){PS.pix=pixPayload(t,oid);PS.stage='pix';renderSheet();return}
  PS.busy=true;renderSheet();setTimeout(function(){PS.busy=false;PS.demo=true;PS.stage='done';renderSheet()},1100)}
function renderPaid(t){var s=PS.stage,hd,bd,ft,back='<button class="ph-btn ph-btn-ghost" data-pback="1" style="width:100%;margin-top:8px">Voltar</button>';
  if(s==='pix'){hd='Pague com Pix';var q=typeof qrcode==='function'?qrSvg(PS.pix):'';

    ft=('<a class="ph-btn ph-btn-wa" target="_blank" rel="noopener" href="'+esc(waLink(msg))+'">'+ic('whatsapp',18)+'Enviar comprovante</a>')+back}

function fileToDataURL(file,max){return new Promise(function(res,rej){var fr=new FileReader();fr.onerror=rej;fr.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL(/png|svg|gif|webp/.test(file.type)?'image/png':'image/jpeg',.84))};im.src=fr.result};fr.readAsDataURL(file)})}
function handleFile(file,tgt){if(!file||!/^image\//.test(file.type)){toast('Escolha um arquivo de imagem');return}
  fileToDataURL(file,tgt==='brand.logo'?420:960).then(function(d){setTgt(tgt,d);renderEditor();refresh();toast('Imagem atualizada')}).catch(function(){toast('Não foi possível ler essa imagem')})}

document.addEventListener('dragover',function(e){var d=e.target.closest&&e.target.closest('.drop');if(d){e.preventDefault();d.classList.add('over');return}
  var c=e.target.closest&&e.target.closest('.icard');if(c&&dragSrc&&dragSrc.l===c.dataset.card){e.preventDefault();$$('.icard.over').forEach(function(x){if(x!==c)x.classList.remove('over')});c.classList.add('over')}});
document.addEventListener('dragleave',function(e){var d=e.target.closest&&e.target.closest('.drop,.icard');if(d&&!d.contains(e.relatedTarget))d.classList.remove('over')});
document.addEventListener('drop',function(e){var d=e.target.closest&&e.target.closest('.drop');if(d){e.preventDefault();d.classList.remove('over');var f=e.dataTransfer&&e.dataTransfer.files[0];if(f)handleFile(f,d.dataset.tgt);return}
  var c=e.target.closest&&e.target.closest('.icard');if(c&&dragSrc&&dragSrc.l===c.dataset.card){e.preventDefault();c.classList.remove('over');moveTo(dragSrc.l,dragSrc.id,c.dataset.cid)}});

var dragSrc=null;
document.addEventListener('pointerdown',function(e){var g=e.target.closest&&e.target.closest('.grip');if(g){var c=g.closest('.icard');if(c)c.draggable=true}});
document.addEventListener('dragstart',function(e){var c=e.target.closest&&e.target.closest('.icard');if(!c)return;dragSrc={l:c.dataset.card,id:c.dataset.cid};e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',c.dataset.cid)}catch(_){}});

function moveTo(l,from,to){if(from===to)return;var a=state[l],fi2=a.findIndex(function(x){return x.id===from}),ti=a.findIndex(function(x){return x.id===to});if(fi2<0||ti<0)return;var it=a.splice(fi2,1)[0];a.splice(ti,0,it);renderEditor();refresh()}
function moveBy(l,id,d){var a=state[l],i=a.findIndex(function(x){return x.id===id}),j=i+d;if(i<0||j<0||j>=a.length)return;var it=a.splice(i,1)[0];a.splice(j,0,it);renderEditor();refresh()}
/* ações por clique */
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,v=b.dataset.v,l=b.dataset.list,id=b.dataset.id;
  if(a==='tab'){ui.tab=v;panel.scrollTop=0;renderEditor();return}
  if(a==='view'){$('#work').dataset.view=v;$$('#mswitch button').forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.v===v))});setTimeout(fit,30);return}
  if(a==='niche'){if(v!==state.niche)setNiche(v);return}
  if(a==='reset'){if(!ui.resetArmed){ui.resetArmed=true;renderEditor();clearTimeout(reset_t);reset_t=setTimeout(function(){ui.resetArmed=false;if(ui.tab==='niche')renderEditor()},4000)}else{ui.resetArmed=false;setNiche(state.niche,true);toast('Exemplo restaurado')}return}
  if(a==='ptog'){state.pay[v]=!state.pay[v];renderEditor();refresh();return}
  if(a==='color'){state.brand.color=v;renderEditor();refresh();return}
  if(a==='font'){state.brand.font=v;renderEditor();refresh();return}
  if(a==='theme'){state.brand.theme=v;renderEditor();refresh();return}
  if(a==='clearimg'){setTgt(b.dataset.tgt,'');renderEditor();refresh();return}
  if(a==='toggle'){ui.open[id]=!ui.open[id];renderEditor();return}
  if(a==='up'){moveBy(l,id,-1);return}
  if(a==='down'){moveBy(l,id,1);return}
  if(a==='del'){state[l]=state[l].filter(function(x){return x.id!==id});delete ui.open[id];pruneCart();renderEditor();refresh();afterCart();toast('Removido');return}
  if(a==='add'){var it=LISTS[l].make();state[l].push(it);ui.open[it.id]=true;renderEditor();refresh();var c=$('[data-cid="'+it.id+'"]',panel);if(c)c.scrollIntoView({block:'nearest',behavior:'smooth'})}
});
